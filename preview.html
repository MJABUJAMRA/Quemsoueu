    const NeuralNetwork = ({ color }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resize();
        window.addEventListener('resize', resize);
        const nodes = Array.from({ length: 60 }, () => ({
          x: Math.random() * canvas.width, y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, r: Math.random() * 2 + 1
        }));
        let animId;
        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          nodes.forEach((n, i) => {
            n.x += n.vx; n.y += n.vy;
            if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
            if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
            ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
            nodes.slice(i + 1).forEach(o => {
              const d = Math.hypot(n.x - o.x, n.y - o.y);
              if (d < 120) { ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(o.x, o.y); ctx.strokeStyle = color.replace(/[\d.]+\)$/, `${0.15 * (1 - d / 120)})`); ctx.stroke(); }
            });
          });
          animId = requestAnimationFrame(animate);
        };
        animate();
        return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animId); };
      }, [color]);
      return <canvas ref={canvasRef} style={{position:'fixed',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:0}} />;
    };

                    <button onClick={goToPoemas} style={{padding:'14px 28px',fontSize:11,letterSpacing:2,border:`1px solid ${c.primary}`,background:c.primary,borderRadius:5,color:c.bg,cursor:'pointer',transition:'all 0.3s'}}>
                      EXPLORAR CÉREBRO →
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {section === 'poemas' && (
            <div style={{minHeight:'100vh',padding:'100px 40px',textAlign:'center',position:'relative',zIndex:1}}>
              <h1 style={{fontSize:'clamp(40px, 10vw, 80px)',fontWeight:'bold',letterSpacing:4,color:c.primary,marginBottom:40}}>POEMAS MENTAIS</h1>
              <BlockchainBrain color={c.primary} size={250} />
              <div style={{maxWidth:800,margin:'60px auto'}}>
                <div style={{padding:40,marginBottom:30,backdropFilter:'blur(30px)',border:`1px solid ${c.primary}22`,borderRadius:15,background:'linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02))'}}>
                  <p style={{fontSize:18,lineHeight:2,fontStyle:'italic',opacity:0.8,marginBottom:20}}>
                    "Quando me dei conta da GOVERNANÇA DO FUTURO, pensei: posso escrever a lei, descentralizada. A melhor maneira de saber o futuro é construí-lo, e eu vou!"
                  </p>
                  <div style={{fontSize:11,letterSpacing:4,opacity:0.5,color:c.primary}}>— MARIA JOÃO ABUJAMRA</div>
                </div>
              </div>
              <button onClick={() => setSection('intro')} style={{padding:'14px 28px',fontSize:11,letterSpacing:2,border:`1px solid ${c.primary}`,background:'transparent',borderRadius:5,color:c.primary,cursor:'pointer'}}>
                ← VOLTAR
              </button>
            </div>
          )}

          {section === 'connect' && (
            <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',padding:'100px 40px',position:'relative',zIndex:1}}>
              <h2 style={{fontSize:'clamp(28px, 6vw, 50px)',fontWeight:'bold',letterSpacing:4,color:c.primary,marginBottom:15}}>CONEXÕES</h2>
              <p style={{fontSize:11,letterSpacing:3,opacity:0.6,marginBottom:60}}>TOKENS DE ACESSO · CLIQUE PARA ENTRAR</p>
              <div style={{display:'flex',justifyContent:'center',gap:25,flexWrap:'wrap',perspective:1000}}>
                {socialTokens.map((t, i) => <SpinningToken key={i} token={t} index={i} />)}
              </div>
              <button onClick={() => setSection('intro')} style={{padding:'14px 28px',fontSize:11,letterSpacing:2,border:`1px solid ${c.primary}`,background:'transparent',borderRadius:5,color:c.primary,cursor:'pointer',marginTop:60}}>
                ← VOLTAR
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<NeuralPortfolio />, document.getElementById('root'));
  </script>
</body>
</html>
